<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walden University Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: calc(100vh - 200px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .message {
            max-width: 70%;
            margin: 8px;
            padding: 12px;
            border-radius: 12px;
        }
        .user-message {
            align-self: flex-end;
            background-color: #7c3aed;
            color: white;
        }
        .bot-message {
            align-self: flex-start;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .sources {
            font-size: 0.75rem;
            margin-top: 8px;
        }
        .sources a {
            color: #2563eb;
            text-decoration: underline;
        }
        .typing-indicator {
            display: inline-block;
            position: relative;
            width: 50px;
            height: 30px;
        }
        .typing-indicator span {
            height: 8px;
            width: 8px;
            float: left;
            margin: 0 1px;
            background-color: #9ca3af;
            display: block;
            border-radius: 50%;
            opacity: 0.4;
        }
        .typing-indicator span:nth-child(1) {
            animation: typing 1s infinite 0s;
        }
        .typing-indicator span:nth-child(2) {
            animation: typing 1s infinite 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation: typing 1s infinite 0.4s;
        }
        @keyframes typing {
            0% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.4; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto max-w-4xl p-4">
        <header class="bg-purple-800 text-white p-4 rounded-t-lg shadow-lg">
            <div class="flex items-center">
<!--                <img src="https://www.waldenu.edu/themes/custom/wal_base_2024/images/svg/logo.svg" alt="Walden University Logo" class="h-12 mr-4">-->
                <div>
                    <h1 class="text-2xl font-bold">Walden University Chatbot</h1>
                    <p class="text-sm">Ask me anything about Walden University programs, admissions, and services</p>
                </div>
            </div>
        </header>

        <div class="bg-white rounded-b-lg shadow-lg p-4">
            <div id="chat-container" class="chat-container">
                <div class="message bot-message">
                    <p>Hello! I'm the Walden University AI assistant. How can I help you today?</p>
                </div>
            </div>

            <div class="mt-4">
                <form id="chat-form" class="flex">
                    <input type="text" id="user-input" class="flex-1 p-2 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-purple-600" placeholder="Type your question...">
                    <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded-r-lg hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-600">Send</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        let conversationId = null;

        // Function to add a message to the chat
        function addMessage(message, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;

            // If it's a bot message with sources, format it appropriately
            if (!isUser && message.sources && message.sources.length > 0) {
                // Split the message to separate the answer from the sources
                const parts = message.answer.split('Sources:');
                const answerText = parts[0].trim();

                // Create paragraph for the answer
                const answerPara = document.createElement('p');
                answerPara.innerHTML = answerText.replace(/\n/g, '<br>');
                messageDiv.appendChild(answerPara);

                // Add sources as links
                const sourcesDiv = document.createElement('div');
                sourcesDiv.className = 'sources';
                sourcesDiv.innerHTML = '<strong>Sources:</strong>';

                const sourcesList = document.createElement('ul');
                sourcesList.className = 'list-disc ml-5 mt-1';

                message.sources.forEach((source, index) => {
                    if (index < 3) { // Limit to top 3 sources
                        const sourceItem = document.createElement('li');
                        const sourceLink = document.createElement('a');
                        sourceLink.href = source.url;
                        sourceLink.target = '_blank';
                        sourceLink.textContent = new URL(source.url).pathname.substring(1);
                        sourceItem.appendChild(sourceLink);
                        sourcesList.appendChild(sourceItem);
                    }
                });

                sourcesDiv.appendChild(sourcesList);
                messageDiv.appendChild(sourcesDiv);
            } else {
                // For user messages or bot messages without sources
                const text = isUser ? message : message.answer || message;
                const para = document.createElement('p');
                para.innerHTML = text.replace(/\n/g, '<br>');
                messageDiv.appendChild(para);
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Function to show typing indicator
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message typing-message';
            typingDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            typingDiv.id = 'typing-indicator';
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Function to hide typing indicator
        function hideTypingIndicator() {
            const typingIndicator = document.getElementById('typing-indicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Form submission handler
        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const message = userInput.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessage(message, true);
            userInput.value = '';

            // Show typing indicator
            showTypingIndicator();

            try {
                // Send message to the API
                const response = await fetch('http://localhost:8000/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        conversation_id: conversationId
                    })
                });

                const data = await response.json();

                // Save conversation ID for future messages
                conversationId = data.conversation_id;

                // Hide typing indicator
                hideTypingIndicator();

                // Add bot response to chat
                addMessage({
                    answer: data.answer,
                    sources: data.sources
                }, false);

            } catch (error) {
                console.error('Error:', error);
                hideTypingIndicator();
                addMessage('Sorry, there was an error processing your request. Please try again.', false);
            }
        });

        // Focus on input field when page loads
        window.onload = function() {
            userInput.focus();
        };
    </script>
</body>
</html>
